name: Build

on:
  push:
    branches: [main]
    tags: ["v[0-9]*", "[0-9]*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # to attach the exe to releases
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --release
      - run: cargo build --release

      # Uploaded unzipped, so the artifact downloads as timesheet.exe itself.
      - uses: actions/upload-artifact@v7
        with:
          path: target/release/timesheet.exe
          archive: false

      # Pushing a version tag (1.0.0 or v1.0.0) publishes a GitHub release with the exe attached.
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/timesheet.exe
